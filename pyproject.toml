[project]
name = "local-elections-up"
version = "0.1.0"
description = "Audited record linkage for the UP local-election data release"
readme = "README.md"
classifiers = ["Private :: Do Not Upload"]
keywords = ["elections", "uttar-pradesh", "india", "data", "record-linkage"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15",
    "preclink==1.2.0",
    "pdfplumber>=0.11",
    "requests",
    "beautifulsoup4",
    "tenacity",
    "lxml",
    "opencv-python-headless",
    "pillow",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_up"
Issues = "https://github.com/in-rolls/local_elections_up/issues"
Documentation = "https://github.com/in-rolls/local_elections_up#readme"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pre-commit>=4",
]
research = [
    "local-reservations==0.5.1",
]

[tool.uv.sources]
# Vendored before the central package was renamed local-elections (v0.7.0);
# it still provides `local_reservations`. Update on the next re-vendor.
local-reservations = { path = "vendor/local_reservations-0.5.1-py3-none-any.whl" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_up"]

[tool.hatch.build.targets.sdist]
include = ["vendor/", "src/", "R/", "scripts/", "tests/", "README.md", "pyproject.toml", "uv.lock", "renv.lock"]
