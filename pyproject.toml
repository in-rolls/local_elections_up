[project]
name = "local-elections-up"
version = "1.0.0"
description = "Audited record linkage for the UP local-election data release"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
classifiers = ["Private :: Do Not Upload"]
keywords = ["elections", "uttar-pradesh", "india", "data", "record-linkage"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "rapidfuzz>=3.14",
    "pyarrow>=15",
    "preclink==1.2.0",
    "pdfplumber>=0.11",
    "requests",
    "beautifulsoup4",
    "tenacity",
    "lxml",
    "opencv-python-headless",
    "pillow",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_up"
Issues = "https://github.com/in-rolls/local_elections_up/issues"
Documentation = "https://github.com/in-rolls/local_elections_up#readme"

[dependency-groups]
dev = [
    "ruff>=0.14",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/local_elections_up/parse/krutidev.py" = ["RUF001"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_up"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "THIRD_PARTY_NOTICES", "LICENSE", "pyproject.toml", "uv.lock"]
